<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microphones — Révision BTS Audiovisuel</title>
  <meta name="description" content="Application de révision : pression acoustique et dB SPL, anatomie d’un micro et chaîne jusqu’au haut-parleur, technologies de micro (dynamique, ruban, électrostatique, électret), capsules et effet de proximité, directivité, sensibilité et fiche technique, types de micros, liaisons symétriques et alimentation fantôme, couples stéréophoniques.">
  <!-- « ../../ » remonte de deux dossiers : modules/tes-microphones/ → racine -->
  <script src="../../js/theme.js"></script>
  <script src="../../js/transition.js"></script>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/application.css">
</head>

<!-- Toute la page (menu, accueil, notions, essentiel, évaluation) est construite
     par js/application.js à partir de contenu.js. Cette page ne contient que
     les LABOS : un <template> par module, avec un ou plusieurs labos chacun.
     Identifiants : m + numéro du module + lettre du labo (m1a-…, m2b-…). -->
<body data-racine="../../">

  <!-- =================== MODULE 1 : DU SON AU SIGNAL =================== -->
  <template data-labo="1">
    <div class="sous-labo"><span class="eyebrow">Labo 1 · L’onde de pression</span><h3>Des molécules qui oscillent, une pression qui voyage</h3><p class="muted">Chaque point est une « tranche » d’air. Les points se serrent (<b>compression</b>, en orange) puis s’écartent (<b>dépression</b>, en bleu) : la pression varie, et la membrane du micro la suit. Le temps est ralenti et le mouvement exagéré pour être visible.</p></div>
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Onde sonore plane → membrane du micro</span><button class="btn small" id="m1a-pause" type="button">⏸ Pause</button></div>
          <canvas id="m1a-cv" class="cv" width="1000" height="520" role="img" aria-label="Une rangée de molécules d’air traversée par une onde sonore : zones de compression et de dépression, courbe de la pression en fonction de la distance avec la longueur d’onde repérée sur une règle, membrane d’un micro qui suit la pression et tension de sortie du micro en fonction du temps"></canvas>
        </div>
        <div class="readouts">
          <div><small>Pression</small><b class="acc" id="m1a-p">—</b></div>
          <div><small>Niveau</small><b id="m1a-l">—</b></div>
          <div><small>Longueur d’onde</small><b id="m1a-lam">—</b></div>
          <div><small>Période</small><b id="m1a-t">—</b></div>
          <div><small>Déplacement air</small><b id="m1a-x">—</b></div>
          <div><small>Tension 20 mV/Pa</small><b id="m1a-u">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <label class="ctl"><span>Fréquence</span><input type="range" id="m1a-f" min="0" max="1000" step="1" value="500"><output id="m1a-fo"></output></label>
          <label class="ctl"><span>Niveau</span><input type="range" id="m1a-niv" min="0" max="140" step="1" value="60"><output id="m1a-nivo"></output></label>
          <p class="muted small" style="margin:10px 0 8px">Niveaux typiques :</p>
          <div class="btnrow" id="m1a-situ">
            <button class="chip" type="button" data-s="seuil">Seuil d’audition</button>
            <button class="chip" type="button" data-s="chuchot">Chuchotement</button>
            <button class="chip" type="button" data-s="conv">Conversation à 1 m</button>
            <button class="chip" type="button" data-s="pa">1 Pa</button>
            <button class="chip" type="button" data-s="cc">Caisse claire de près</button>
          </div>
          <p class="muted small" style="margin:10px 0 8px">Fréquences :</p>
          <div class="btnrow" id="m1a-freq">
            <button class="chip" type="button" data-s="20">20 Hz</button>
            <button class="chip" type="button" data-s="100">100 Hz</button>
            <button class="chip" type="button" data-s="1000">1 kHz</button>
            <button class="chip" type="button" data-s="10000">10 kHz</button>
          </div>
        </div>
        <div class="card"><h3>Calcul pas à pas</h3><div class="calc" id="m1a-calc" aria-live="polite"></div></div>
        <div class="card"><h3>Ce qu’il faut observer</h3><div id="m1a-msg" class="note" aria-live="polite"></div></div>
      </div>
    </div>

    <div class="sous-labo"><span class="eyebrow">Labo 2 · Niveau et distance</span><h3>−6 dB chaque fois que la distance double</h3><p class="muted">Éloignez le micro de la source : en champ libre, la pression est divisée par deux à chaque doublement de distance. Ajoutez une seconde source identique : le niveau ne gagne que <b>3 dB</b>.</p></div>
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Source, micro et échelle des niveaux</span><button class="btn small" id="m1b-pause" type="button">⏸ Pause</button></div>
          <canvas id="m1b-cv" class="cv" width="1000" height="470" role="img" aria-label="Une source sonore et un micro sur un axe gradué en mètres sur une échelle logarithmique, avec les doublements de distance repérés ; à droite, une échelle verticale des niveaux en dB SPL avec des repères et le niveau reçu par le micro"></canvas>
        </div>
        <div class="readouts">
          <div><small>Distance</small><b id="m1b-d">—</b></div>
          <div><small>Niveau reçu</small><b class="acc" id="m1b-l">—</b></div>
          <div><small>Pression reçue</small><b id="m1b-p">—</b></div>
          <div><small>Écart par rapport à 1 m</small><b id="m1b-e">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <label class="ctl"><span>Niveau à 1 m</span><input type="range" id="m1b-l1" min="40" max="120" step="1" value="80"><output id="m1b-l1o"></output></label>
          <label class="ctl"><span>Distance</span><input type="range" id="m1b-dist" min="0" max="1000" step="1" value="435"><output id="m1b-disto"></output></label>
          <div class="ctl"><span>Sources</span><div id="m1b-n" aria-label="Nombre de sources"></div></div>
          <p class="muted small" style="margin:10px 0 8px">Situations toutes prêtes :</p>
          <div class="btnrow" id="m1b-situ">
            <button class="chip" type="button" data-s="voix">Voix, micro à 30 cm</button>
            <button class="chip" type="button" data-s="voix4">Voix, micro à 4 m</button>
            <button class="chip" type="button" data-s="ampli">Ampli guitare à 10 cm</button>
            <button class="chip" type="button" data-s="double">Deux doublements</button>
          </div>
        </div>
        <div class="card"><h3>Calcul pas à pas</h3><div class="calc" id="m1b-calc" aria-live="polite"></div></div>
        <div class="card"><h3>Ce qu’il faut observer</h3><div id="m1b-msg" class="note" aria-live="polite"></div></div>
      </div>
    </div>
  </template>

  <!-- =================== MODULE 2 : ANATOMIE, DU CHANTEUR AU HAUT-PARLEUR =================== -->
  <template data-labo="2">
    <div class="sous-labo"><span class="eyebrow">Labo 1 · Ouvrir le micro</span><h3>Une onde traverse le micro, pièce par pièce</h3><p class="muted">L’onde arrive par la gauche. Touchez une pièce du micro pour savoir à quoi elle sert, suivez la <b>visite guidée</b>, ou passez en <b>vue éclatée</b> pour séparer les pièces. Le temps est ralenti et les mouvements sont exagérés pour être visibles.</p></div>
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Coupe d’un micro de main, traversée par une onde</span><button class="btn small" id="m2a-pause" type="button">⏸ Pause</button></div>
          <canvas id="m2a-cv" class="cv" width="1000" height="520" role="img" aria-label="Coupe animée d’un micro de main, dynamique ou statique : l’onde sonore traverse la grille et la mousse, fait bouger la membrane ; la bobine ou le condensateur produit une tension qui parcourt les fils jusqu’au connecteur XLR ; deux oscillogrammes montrent la pression sur la membrane et la tension de sortie"></canvas>
        </div>
        <div class="readouts">
          <div><small>Pièce</small><b class="acc" id="m2a-piece">—</b></div>
          <div><small>Elle reçoit</small><b id="m2a-recoit">—</b></div>
          <div><small>Elle produit</small><b id="m2a-produit">—</b></div>
          <div><small>Tension de sortie</small><b id="m2a-u">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <div class="ctl"><span>Micro</span><div id="m2a-tech" aria-label="Type de micro"></div></div>
          <label class="ctl"><span>Niveau</span><input type="range" id="m2a-niv" min="50" max="130" step="1" value="94"><output id="m2a-nivo"></output></label>
          <div class="btnrow" style="margin-top:10px">
            <button class="btn small" id="m2a-eclate" type="button">Vue éclatée</button>
            <button class="btn small" id="m2a-visite" type="button">▶ Visite guidée</button>
          </div>
          <p class="muted small" style="margin:12px 0 8px">Suivre le son, étape par étape :</p>
          <div class="btnrow" id="m2a-situ">
            <button class="chip" type="button" data-s="0">1 · L’onde</button>
            <button class="chip" type="button" data-s="1">2 · La grille</button>
            <button class="chip" type="button" data-s="2">3 · La membrane</button>
            <button class="chip" type="button" data-s="3">4 · La transduction</button>
            <button class="chip" type="button" data-s="4">5 · Le corps</button>
            <button class="chip" type="button" data-s="5">6 · La sortie</button>
          </div>
        </div>
        <div class="card">
          <h3>La pièce touchée</h3>
          <div id="m2a-msg" class="note" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <div class="sous-labo"><span class="eyebrow">Labo 2 · Toute la chaîne</span><h3>Du chanteur au haut-parleur, puis à l’oreille</h3><p class="muted">Le son devient tension dans le micro, est amplifié par le <b>préampli</b>, dosé par la <b>console</b>, rendu puissant par l’<b>ampli</b>, et redevient son dans le <b>haut-parleur</b>. Chaque oscillogramme montre le signal à une étape, avec sa vraie valeur. Montez trop un gain : le signal est écrêté.</p></div>
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>La chaîne électroacoustique</span><button class="btn small" id="m2b-pause" type="button">⏸ Pause</button></div>
          <canvas id="m2b-cv" class="cv" width="1000" height="540" role="img" aria-label="Chaîne animée : un chanteur, un micro, un câble, un préampli, une console, un ampli de puissance, un haut-parleur en coupe dont la membrane bouge, puis un auditeur ; six oscillogrammes montrent le signal à chaque étape avec sa valeur"></canvas>
        </div>
        <div class="readouts">
          <div><small>Sortie micro</small><b id="m2b-umic">—</b></div>
          <div><small>Sortie préampli</small><b id="m2b-upre">—</b></div>
          <div><small>Haut-parleur</small><b id="m2b-php">—</b></div>
          <div><small>Chez l’auditeur</small><b class="acc" id="m2b-laud">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>La source et le micro</h3>
          <label class="ctl"><span>Niveau au micro</span><input type="range" id="m2b-niv" min="40" max="130" step="1" value="74"><output id="m2b-nivo"></output></label>
          <div class="ctl"><span>Micro</span><div id="m2b-micro" aria-label="Type de micro"></div></div>
        </div>
        <div class="card">
          <h3>La régie</h3>
          <label class="ctl"><span>Gain préampli</span><input type="range" id="m2b-gain" min="0" max="70" step="1" value="56"><output id="m2b-gaino"></output></label>
          <label class="ctl"><span>Fader console</span><input type="range" id="m2b-fader" min="-40" max="10" step="1" value="-9"><output id="m2b-fadero"></output></label>
          <label class="ctl"><span>Auditeur à</span><input type="range" id="m2b-dist" min="0" max="1000" step="1" value="408"><output id="m2b-disto"></output></label>
          <p class="muted small" style="margin:6px 0 0">Ampli : gain de 26 dB (× 20), 100 W au plus sur 8 Ω. Haut-parleur : 8 Ω, sensibilité 90 dB (1 W / 1 m).</p>
          <div class="btnrow" style="margin-top:10px"><button class="btn small" id="m2b-auto" type="button">Régler le gain pour +4 dBu</button></div>
          <p class="muted small" style="margin:10px 0 8px">Situations toutes prêtes :</p>
          <div class="btnrow" id="m2b-situ">
            <button class="chip" type="button" data-s="voix">Voix parlée, micro statique</button>
            <button class="chip" type="button" data-s="chant">Chant au micro dynamique</button>
            <button class="chip" type="button" data-s="trop">Trop de gain</button>
            <button class="chip" type="button" data-s="fort">Ampli à fond</button>
          </div>
        </div>
        <div class="card"><h3>Calcul pas à pas</h3><div class="calc" id="m2b-calc" aria-live="polite"></div></div>
        <div class="card"><h3>Ce qu’il faut observer</h3><div id="m2b-msg" class="note" aria-live="polite"></div></div>
      </div>
    </div>
  </template>

  <!-- =================== MODULE 3 : TECHNOLOGIES DE MICRO =================== -->
  <template data-labo="3">
    <div class="sous-labo"><span class="eyebrow">Labo 1 · Quatre capsules ouvertes</span><h3>Même son, quatre façons de produire une tension</h3><p class="muted">Choisissez une technologie : l’onde arrive par la gauche, la membrane bouge, une tension sort. L’oscillogramme garde <b>la même échelle</b> pour toutes les technologies : comparez les tensions au même niveau sonore. Le temps est ralenti et les mouvements exagérés.</p></div>
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Coupe de la capsule et tension de sortie</span><button class="btn small" id="m3a-pause" type="button">⏸ Pause</button></div>
          <canvas id="m3a-cv" class="cv" width="1000" height="520" role="img" aria-label="Coupe animée de la capsule choisie (dynamique, ruban, électrostatique ou électret) traversée par une onde sonore, oscillogramme de la tension de sortie à échelle commune et comparaison des tensions délivrées par les quatre technologies au même niveau sonore"></canvas>
        </div>
        <div class="readouts">
          <div><small>Grandeur captée</small><b id="m3a-gr">—</b></div>
          <div><small>Sensibilité (exemple)</small><b id="m3a-sex">—</b></div>
          <div><small>Pression</small><b id="m3a-p">—</b></div>
          <div><small>Tension délivrée</small><b class="acc" id="m3a-u">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <div class="ctl"><span>Technologie</span><div id="m3a-tech" aria-label="Technologie de transduction"></div></div>
          <label class="ctl"><span>Fréquence</span><input type="range" id="m3a-f" min="0" max="1000" step="1" value="565"><output id="m3a-fo"></output></label>
          <label class="ctl"><span>Niveau</span><input type="range" id="m3a-niv" min="40" max="130" step="1" value="94"><output id="m3a-nivo"></output></label>
          <p class="muted small" style="margin:10px 0 8px">Situations toutes prêtes :</p>
          <div class="btnrow" id="m3a-situ">
            <button class="chip" type="button" data-s="voix">Voix à 30 cm (74 dB)</button>
            <button class="chip" type="button" data-s="pa">1 Pa à 1 kHz</button>
            <button class="chip" type="button" data-s="grave">Grave à 100 Hz</button>
            <button class="chip" type="button" data-s="caisse">Caisse claire (125 dB)</button>
          </div>
        </div>
        <div class="card"><h3>Fiche de la technologie</h3><div class="calc" id="m3a-fiche" aria-live="polite"></div></div>
        <div class="card"><h3>Ce qu’il faut observer</h3><div id="m3a-msg" class="note" aria-live="polite"></div></div>
      </div>
    </div>

    <div class="sous-labo"><span class="eyebrow">Labo 2 · Le condensateur à charge constante</span><h3>Pourquoi la tension suit le déplacement de la membrane</h3><p class="muted">La charge Q est fixée par la polarisation et ne varie pas au rythme du son (résistance de l’ordre du GΩ). Quand la membrane se rapproche, la capacité augmente et la tension <b>baisse</b> en proportion : U = Q/C = Q·d/(ε<sub>0</sub>S).</p></div>
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Membrane, contre-électrode et tension</span><button class="btn small" id="m3b-pause" type="button">⏸ Pause</button></div>
          <canvas id="m3b-cv" class="cv" width="1000" height="470" role="img" aria-label="Vue de côté de la membrane et de la contre-électrode d’un micro électrostatique, avec leurs charges, l’écart qui varie et la tension mesurée ; à droite, la droite tension en fonction de la distance à charge constante"></canvas>
        </div>
        <div class="readouts">
          <div><small>Surface</small><b id="m3b-s">—</b></div>
          <div><small>Capacité au repos</small><b id="m3b-c">—</b></div>
          <div><small>Charge Q</small><b id="m3b-q">—</b></div>
          <div><small>Tension du signal ΔU</small><b class="acc" id="m3b-du">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <label class="ctl"><span>Diamètre</span><input type="range" id="m3b-dia" min="6" max="34" step="1" value="20"><output id="m3b-diao"></output></label>
          <label class="ctl"><span>Distance d₀</span><input type="range" id="m3b-d0" min="10" max="60" step="1" value="25"><output id="m3b-d0o"></output></label>
          <label class="ctl"><span>Polarisation U₀</span><input type="range" id="m3b-u0" min="20" max="80" step="1" value="48"><output id="m3b-u0o"></output></label>
          <label class="ctl"><span>Déplacement Δd</span><input type="range" id="m3b-dd" min="0" max="50" step="1" value="10"><output id="m3b-ddo"></output></label>
          <p class="muted small" style="margin:10px 0 8px">Situations toutes prêtes :</p>
          <div class="btnrow" id="m3b-situ">
            <button class="chip" type="button" data-s="cours">Exemple du cours</button>
            <button class="chip" type="button" data-s="petite">Petite membrane</button>
            <button class="chip" type="button" data-s="grande">Grande membrane</button>
            <button class="chip" type="button" data-s="serre">Écart réduit de moitié</button>
          </div>
        </div>
        <div class="card"><h3>Calcul pas à pas</h3><div class="calc" id="m3b-calc" aria-live="polite"></div></div>
        <div class="card"><h3>Ce qu’il faut observer</h3><div id="m3b-msg" class="note" aria-live="polite"></div></div>
      </div>
    </div>

    <div class="sous-labo"><span class="eyebrow">Labo 3 · L’induction</span><h3>e = B·l·v : un fil qui coupe un champ magnétique</h3><p class="muted">Un fil (vu en coupe) oscille entre les pôles d’un aimant, comme la bobine d’un micro dynamique. La tension est maximale quand le fil va le plus <b>vite</b>, et nulle quand il s’arrête pour repartir.</p></div>
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Conducteur dans l’entrefer</span><button class="btn small" id="m3c-pause" type="button">⏸ Pause</button></div>
          <canvas id="m3c-cv" class="cv" width="1000" height="450" role="img" aria-label="Un fil vu en coupe oscille de haut en bas entre un pôle nord et un pôle sud ; à droite, la position, la vitesse et la tension induite en fonction du temps"></canvas>
        </div>
        <div class="readouts">
          <div><small>Vitesse maximale</small><b id="m3c-v">—</b></div>
          <div><small>Tension maximale</small><b class="acc" id="m3c-e">—</b></div>
          <div><small>Tension efficace</small><b id="m3c-eff">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <label class="ctl"><span>Champ B</span><input type="range" id="m3c-b" min="0.2" max="1.5" step="0.1" value="1"><output id="m3c-bo"></output></label>
          <label class="ctl"><span>Longueur l</span><input type="range" id="m3c-l" min="0.5" max="10" step="0.5" value="2"><output id="m3c-lo"></output></label>
          <label class="ctl"><span>Vitesse max v</span><input type="range" id="m3c-vit" min="0.1" max="5" step="0.1" value="1"><output id="m3c-vito"></output></label>
        </div>
        <div class="card"><h3>Calcul pas à pas</h3><div class="calc" id="m3c-calc" aria-live="polite"></div></div>
        <div class="card"><h3>Ce qu’il faut observer</h3><div id="m3c-msg" class="note" aria-live="polite"></div></div>
      </div>
    </div>
  </template>

  <!-- =================== MODULE 4 : LES CAPSULES =================== -->
  <template data-labo="4">
    <div class="sous-labo"><span class="eyebrow">Labo 1 · Ce que voit la membrane</span><h3>Mesurer une directivité, angle par angle</h3><p class="muted">Une onde plane arrive sur la capsule. Faites <b>glisser la source</b> autour d’elle (ou utilisez le curseur) : la pression devant et derrière la membrane s’affiche à droite, et chaque angle visité ajoute un point au diagramme polaire.</p></div>
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Vue de dessus : la capsule et l’onde qui arrive</span><button class="btn small" id="m4a-pause" type="button">⏸ Pause</button></div>
          <canvas id="m4a-cv" class="cv" width="1000" height="520" role="img" aria-label="Vue de dessus d’une capsule de micro frappée par une onde plane venant d’un angle réglable. À droite, la pression sur la face avant, la pression sur la face arrière et la force résultante sur la membrane ; en bas, le diagramme polaire construit point par point avec les mesures."></canvas>
        </div>
        <div class="readouts">
          <div><small>Angle de la source</small><b class="acc" id="m4a-th">—</b></div>
          <div><small>Niveau capté</small><b id="m4a-amp">—</b></div>
          <div><small>Polarité</small><b id="m4a-pol">—</b></div>

    <div class="lab">
      <div class="lab-stage">

    <div class="sous-labo"><span class="eyebrow">Labo 2 · Le micro canon</span><h3>Quand le tube à interférences devient-il efficace ?</h3><p class="muted">Le son qui entre par chaque fente arrive à la capsule avec un <b>décalage</b> qui dépend de l’angle. Les flèches de droite additionnent ces contributions : si elles tournent en rond, elles s’annulent. Changez la fréquence et la longueur du tube.</p></div>

      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Les deux trajets · la courbe de réponse</span><button class="btn small" id="m7b-pause" type="button">⏸ Pause</button></div>
          <canvas id="m7b-cv" class="cv" width="1000" height="520" role="img" aria-label="À gauche, vue de côté d’une personne qui parle devant un micro placé au-dessus d’une table, avec le trajet direct, le trajet réfléchi par la table et la source image ; à droite, la courbe de réponse en fréquence du micro avec les creux du filtre en peigne"></canvas>
        </div>
        <div class="readouts">
          <div><small>Différence de trajet</small><b id="m7b-delta">—</b></div>
          <div><small>Retard</small><b id="m7b-tau">—</b></div>
          <div><small>Premier creux</small><b class="acc" id="m7b-f1">—</b></div>
          <div><small>Profondeur des creux</small><b id="m7b-prof">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <label class="ctl"><span>Hauteur du micro</span><input type="range" id="m7b-h" min="0" max="1000" step="1" value="780"><output id="m7b-ho"></output></label>
          <label class="ctl"><span>Distance bouche – micro</span><input type="range" id="m7b-d" min="0.2" max="1.4" step="0.01" value="0.6"><output id="m7b-do"></output></label>
          <label class="ctl"><span>Hauteur de la bouche</span><input type="range" id="m7b-hs" min="0.2" max="0.55" step="0.01" value="0.4"><output id="m7b-hso"></output></label>
          <label class="ctl"><span>Réflexion de la table</span><input type="range" id="m7b-r" min="0" max="1" step="0.05" value="0.9"><output id="m7b-ro"></output></label>
          <p class="muted small" style="margin:10px 0 8px">Situations toutes prêtes :</p>
          <div class="btnrow" id="m7b-situ">
            <button class="chip" type="button" data-s="pied">Micro sur pied</button>
            <button class="chip" type="button" data-s="bas">Micro bas sur la table</button>
            <button class="chip" type="button" data-s="surface">Micro de surface</button>
            <button class="chip" type="button" data-s="tapis">Table couverte de feutre</button>
          </div>
        </div>
        <div class="card"><h3>Ce qu’il faut observer</h3><div id="m7b-msg" class="note" aria-live="polite"></div></div>
        <div class="card"><h3>Calcul pas à pas</h3><div class="calc" id="m7b-calc"></div></div>
      </div>
    </div>
  </template>

  <!-- =================== MODULE 8 : LIAISONS ET ALIMENTATIONS =================== -->
  <template data-labo="8">
    <div class="sous-labo"><span class="eyebrow">Labo 1 · Symétrique contre asymétrique</span><h3>Où passe le parasite ?</h3><p class="muted">Un câble micro longe un transformateur qui rayonne un champ à 50 Hz. Comparez les deux liaisons : en <b>symétrique</b>, le parasite est le même sur les deux conducteurs, et la soustraction l’efface.</p></div>
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Câble, parasite et oscilloscopes</span><button class="btn small" id="m8a-pause" type="button">⏸ Pause</button></div>
          <canvas id="m8a-cv" class="cv" width="1000" height="540" role="img" aria-label="Un micro relié à une console par un câble qui passe près d’une source de parasite. Trois oscilloscopes montrent la tension sur chaque conducteur et la tension de sortie de l’entrée"></canvas>
        </div>
        <div class="readouts">
          <div><small>Signal</small><b id="m8a-sig">—</b></div>
          <div><small>Parasite capté</small><b id="m8a-par">—</b></div>
          <div><small>Parasite en sortie</small><b id="m8a-res">—</b></div>
          <div><small>Signal / parasite</small><b class="acc" id="m8a-sb">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <div class="ctl"><span>Liaison</span><div id="m8a-type" aria-label="Type de liaison"></div></div>
          <label class="ctl"><span>Parasite (10 m)</span><input type="range" id="m8a-p" min="-90" max="-30" step="1" value="-55"><output id="m8a-po"></output></label>
          <label class="ctl"><span>Longueur</span><input type="range" id="m8a-l" min="0" max="1000" step="1" value="500"><output id="m8a-lo"></output></label>
          <label class="ctl" id="m8a-ligne-t"><span>TRMC</span><input type="range" id="m8a-t" min="20" max="90" step="1" value="70"><output id="m8a-to"></output></label>
          <p class="muted small" style="margin:10px 0 8px">Situations toutes prêtes :</p>
          <div class="btnrow" id="m8a-situ">
            <button class="chip" type="button" data-s="court">Câble micro de 5 m</button>
            <button class="chip" type="button" data-s="scene">Multipaire de 80 m près d’un gradateur</button>
            <button class="chip" type="button" data-s="jack">Jack instrument de 10 m</button>
            <button class="chip" type="button" data-s="abime">Entrée symétrique médiocre</button>
          </div>
        </div>
        <div class="card"><h3>Ce qu’il faut observer</h3><div id="m8a-msg" class="note" aria-live="polite"></div></div>
        <div class="card"><h3>Calcul pas à pas</h3><div class="calc" id="m8a-calc" aria-live="polite"></div></div>
      </div>
    </div>

    <div class="sous-labo"><span class="eyebrow">Labo 2 · XLR et alimentations</span><h3>Quelle tension sur chaque broche ?</h3><p class="muted">Choisissez une alimentation et un micro. Les tensions continues de chaque broche sont mesurées par rapport à la broche 1 (masse). Touchez une broche du connecteur pour connaître son rôle.</p></div>
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Console → câble → micro</span><button class="btn small" id="m8b-pause" type="button">⏸ Pause</button></div>
          <canvas id="m8b-cv" class="cv" width="1000" height="520" role="img" aria-label="Schéma d’une alimentation de micro : la console, ses résistances d’alimentation, les trois conducteurs du câble XLR et le micro, avec la tension de chaque broche et le trajet du courant"></canvas>
        </div>
        <div class="readouts">
          <div><small>Broche 2 / 1</small><b id="m8b-u2">—</b></div>
          <div><small>Broche 3 / 1</small><b id="m8b-u3">—</b></div>
          <div><small>Entre 2 et 3</small><b id="m8b-u23">—</b></div>
          <div><small>Au micro</small><b class="acc" id="m8b-um">—</b></div>
          <div><small>Courant</small><b id="m8b-i">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <div class="ctl"><span>Alimentation</span><div id="m8b-alim" aria-label="Alimentation"></div></div>
          <div class="ctl"><span>Micro</span><div id="m8b-micro" aria-label="Type de micro"></div></div>
          <label class="ctl" id="m8b-ligne-i"><span>Consommation</span><input type="range" id="m8b-c" min="1" max="10" step="0.5" value="4"><output id="m8b-co"></output></label>
          <label class="ctl"><span>Câble défectueux</span><input type="checkbox" id="m8b-def"></label>
        </div>
        <div class="card"><h3>Ce qu’il faut observer</h3><div id="m8b-msg" class="note" aria-live="polite"></div></div>
        <div class="card"><h3>La broche touchée</h3><div id="m8b-pin" class="note" aria-live="polite">Touchez une broche du connecteur XLR dessiné à gauche.</div></div>
      </div>
    </div>

    <div class="sous-labo"><span class="eyebrow">Labo 3 · Niveaux</span><h3>Du niveau micro au niveau ligne</h3><p class="muted">Placez une tension sur l’échelle des niveaux : les dBu, les dBV et les volts disent la même chose avec des références différentes.</p></div>
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Échelle des niveaux</span></div>
          <canvas id="m8c-cv" class="cv" width="1000" height="450" role="img" aria-label="Une échelle de niveaux de −80 à +24 dBu avec les zones du niveau micro et du niveau ligne, les repères +4 dBu et −10 dBV, et le niveau choisi"></canvas>
        </div>
        <div class="readouts">
          <div><small>Niveau</small><b class="acc" id="m8c-dbu">—</b></div>
          <div><small>En dBV</small><b id="m8c-dbv">—</b></div>
          <div><small>Tension</small><b id="m8c-v">—</b></div>
          <div><small>Écart avec +4 dBu</small><b id="m8c-ecart">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <label class="ctl"><span>Niveau (dBu)</span><input type="range" id="m8c-l" min="-80" max="24" step="0.1" value="4"><output id="m8c-lo"></output></label>
          <p class="muted small" style="margin:10px 0 8px">Situations toutes prêtes :</p>
          <div class="btnrow" id="m8c-situ">
            <button class="chip" type="button" data-s="dyn">Micro dynamique, voix</button>
            <button class="chip" type="button" data-s="stat">Micro statique, voix</button>
            <button class="chip" type="button" data-s="gp">Ligne grand public −10 dBV</button>
            <button class="chip" type="button" data-s="pro">Ligne pro +4 dBu</button>
          </div>
        </div>
        <div class="card"><h3>Calcul pas à pas</h3><div class="calc" id="m8c-calc" aria-live="polite"></div></div>
        <div class="card"><h3>Ce qu’il faut observer</h3><div id="m8c-msg" class="note" aria-live="polite"></div></div>
      </div>
    </div>
  </template>

  <!-- =================== MODULE 9 : COUPLES STÉRÉOPHONIQUES =================== -->
  <template data-labo="9">
    <div class="sous-labo"><span class="eyebrow">Labo 1 · Plan de scène</span><h3>De la scène aux enceintes</h3><p class="muted">Choisissez un couple, puis faites glisser le <b>soliste</b> (point jaune) sur la scène. Le labo calcule la différence de niveau et la différence de temps entre les deux micros, et place la source fantôme entre les enceintes. Le secteur jaune est l’<b>angle de prise de son</b>.</p></div>
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>La scène vue de dessus · l’écoute</span><button class="btn small" id="m9a-pause" type="button">⏸ Pause</button></div>
          <canvas id="m9a-cv" class="cv" width="1000" height="540" role="img" aria-label="À gauche, une scène vue de dessus avec des instruments, un soliste déplaçable et le couple de micros avec son angle de prise de son. À droite, le triangle d’écoute stéréo et la position perçue de chaque instrument entre les deux enceintes"></canvas>
        </div>
        <div class="readouts">
          <div><small>ΔL (soliste)</small><b id="m9a-dl">—</b></div>
          <div><small>Δt (soliste)</small><b id="m9a-dt">—</b></div>
          <div><small>Décalage</small><b id="m9a-dec">—</b></div>
          <div><small>Angle de prise</small><b class="acc" id="m9a-apds">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Le couple</h3>
          <div class="ctl"><span>Couple</span><div id="m9a-couple" aria-label="Type de couple"></div></div>
          <label class="ctl"><span>Directivité</span><select id="m9a-dir"></select></label>
          <label class="ctl"><span>Angle entre axes</span><input type="range" id="m9a-ang" min="0" max="180" step="1" value="110"><output id="m9a-ango"></output></label>
          <label class="ctl"><span>Écartement</span><input type="range" id="m9a-d" min="0" max="200" step="1" value="17"><output id="m9a-do"></output></label>
        </div>
        <div class="card">
          <h3>La scène</h3>
          <label class="ctl"><span>Largeur vue du couple</span><input type="range" id="m9a-w" min="20" max="170" step="1" value="100"><output id="m9a-wo"></output></label>
          <p class="muted small" style="margin:10px 0 8px">Situations toutes prêtes :</p>
          <div class="btnrow" id="m9a-situ">
            <button class="chip" type="button" data-s="orch">Grand orchestre de près (140°)</button>
            <button class="chip" type="button" data-s="quat">Quatuor (60°)</button>
            <button class="chip" type="button" data-s="bord">Soliste au bord</button>
          </div>
        </div>
        <div class="card"><h3>Ce qu’il faut observer</h3><div id="m9a-msg" class="note" aria-live="polite"></div></div>
        <div class="card"><h3>Calcul pas à pas</h3><div class="calc" id="m9a-calc" aria-live="polite"></div></div>
      </div>
    </div>

    <div class="sous-labo"><span class="eyebrow">Labo 2 · Le couple MS</span><h3>Deux micros réels, deux micros virtuels</h3><p class="muted">Le micro M regarde la scène, le bidirectionnel S regarde les côtés. Le dématriçage <b>G = M + S</b> et <b>D = M − S</b> fabrique deux micros virtuels. Montez le niveau de S : ils s’écartent, l’image s’élargit.</p></div>
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Micros réels · micros virtuels</span><button class="btn small" id="m9b-pause" type="button">⏸ Pause</button></div>
          <canvas id="m9b-cv" class="cv" width="1000" height="520" role="img" aria-label="À gauche, les directivités des micros M et S. À droite, les directivités des micros virtuels gauche et droite obtenus par dématriçage, et une source qui tourne autour du couple avec les niveaux de chaque voie"></canvas>
        </div>
        <div class="readouts">
          <div><small>Axes virtuels</small><b class="acc" id="m9b-axes">—</b></div>
          <div><small>Directivité (A)</small><b id="m9b-dir">—</b></div>
          <div><small>Niveau de S</small><b id="m9b-gdb">—</b></div>
          <div><small>Somme mono</small><b id="m9b-mono">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <div class="ctl"><span>Micro M</span><div id="m9b-m" aria-label="Directivité du micro M"></div></div>
          <label class="ctl"><span>Niveau de S</span><input type="range" id="m9b-g" min="0" max="1.5" step="0.01" value="0.5"><output id="m9b-go"></output></label>
          <p class="muted small" style="margin:10px 0 8px">Situations toutes prêtes :</p>
          <div class="btnrow" id="m9b-situ">
            <button class="chip" type="button" data-s="etroit">Étroit</button>
            <button class="chip" type="button" data-s="xy">Axes virtuels à ±45°</button>
            <button class="chip" type="button" data-s="blum">Équivalent Blumlein</button>
            <button class="chip" type="button" data-s="large">Large</button>
          </div>
        </div>
        <div class="card"><h3>Ce qu’il faut observer</h3><div id="m9b-msg" class="note" aria-live="polite"></div></div>
        <div class="card"><h3>Calcul pas à pas</h3><div class="calc" id="m9b-calc" aria-live="polite"></div></div>
      </div>
    </div>
  </template>
