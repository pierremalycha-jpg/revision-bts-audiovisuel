<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ====================================================================
       MODÈLE D'APPLICATION — mode d'emploi
       1. Duplique le dossier « modele » et renomme la copie
          (ex. « tmo-nom-de-la-notion » : minuscules, tirets, pas d'accents).
       2. Écris le contenu dans contenu.js (notions, essentiel, questions).
       3. Écris les labos : leur HTML ci-dessous (un <template> par module),
          leur code dans labos.js.
       4. Déclare l'application dans js/catalogue.js : son icône apparaît
          sur la page de son option.
       Le détail est dans docs/CHARTE-APPLICATIONS.md.

       Cette page ne contient QUE les labos : le menu, l'accueil, les
       notions, l'essentiel et l'évaluation sont construits par
       js/application.js à partir de contenu.js.
       ==================================================================== -->

  <!-- À ADAPTER : le titre de l'onglet (il est aussi remplacé automatiquement) -->
  <title>Nom de l’application — Révision BTS Audiovisuel</title>
  <script src="../../js/theme.js"></script>
  <script src="../../js/transition.js"></script>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/application.css">
</head>

<body data-racine="../../">

  <!-- =================== LABO DU MODULE 1 ===================
       Structure de référence : la scène à gauche (elle reste visible quand on
       fait défiler les réglages), les réglages à droite.
       Les identifiants commencent par le numéro du module (m1-…) pour ne
       jamais entrer en collision avec ceux d'un autre labo.

       Interface épurée (par défaut) — le kit range le labo tout seul :
       - PLUSIEURS LABOS dans un module : fais précéder chacun d'un titre
           <div class="sous-labo"><span class="eyebrow">Labo 1 · Nom court</span>
             <h3>La question du labo</h3><p class="muted">La consigne.</p></div>
         Chaque labo devient un ONGLET (« Labo 1 / Nom court ») ; un seul est
         affiché à la fois, avec « Labo suivant → » en bas.
       - Une carte qui contient un .calc (« Calcul pas à pas ») est REPLIÉE
         derrière un « + » : l'élève l'ouvre quand il en a besoin.
       - « Ce qu'il faut observer » et les réglages restent toujours visibles.
       - Une animation doit s'arrêter quand sa scène est cachée et repartir
         dans Application.surAffichage(n, …) : le kit l'appelle quand le labo
         redevient visible (étape « Manipuler », changement d'onglet). -->
  <template data-labo="1">
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Titre de la scène</span><div id="m1-forme" aria-label="Forme"></div></div>
          <canvas id="m1-scene" class="cv" width="1000" height="450" role="img" aria-label="À ADAPTER : décrire la scène pour les lecteurs d’écran"></canvas>
        </div>
        <div class="readouts">
          <div><small>Grandeur G</small><b class="acc" id="m1-g">—</b></div>
          <div><small>Forme</small><b id="m1-f">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <p class="muted small">Une phrase qui dit ce que l’on règle.</p>
          <label class="ctl"><span>Réglage A</span><input type="range" id="m1-a" min="1" max="10" step="0.5" value="3"><output id="m1-ao"></output></label>
          <label class="ctl"><span>Réglage B</span><input type="range" id="m1-b" min="1" max="10" step="0.5" value="4"><output id="m1-bo"></output></label>
        </div>
        <div class="card">
          <h3>Ce qu’il faut observer</h3>
          <div id="m1-msg" class="note" aria-live="polite"></div>
        </div>
        <div class="card">
          <h3>Calcul pas à pas</h3>
          <div class="calc" id="m1-calc"></div>
        </div>
      </div>
    </div>
  </template>

  <!-- Pas de <template data-labo="2"> : le module 2 n'a pas d'étape « Manipuler ». -->

  <!-- Scripts communs : ne pas modifier, ne pas changer l'ordre -->
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/suivi.js"></script>
  <script src="../../js/commun.js"></script>
  <script src="../../js/catalogue.js"></script>
  <script src="../../js/applications.js"></script>
  <script src="../../js/application.js"></script>
  <!-- Scripts propres à CETTE application -->
  <script src="contenu.js"></script>
  <script src="labos.js"></script>
  <script>
    Application.demarrer(APPLICATION);
  </script>
</body>
</html>
