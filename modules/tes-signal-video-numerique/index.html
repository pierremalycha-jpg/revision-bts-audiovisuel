<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal vidéo numérique — Révision BTS Audiovisuel</title>
  <meta name="description" content="Application de révision : échantillonnage, quantification, 4:4:4, 4:2:2, 4:2:0 et débit d'un signal vidéo numérique.">
  <!-- « ../../ » remonte de deux dossiers : modules/tes-signal-video-numerique/ → racine -->
  <script src="../../js/theme.js"></script>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/application.css">
</head>

<!-- data-racine : chemin vers la racine du site (utilisé par js/commun.js).
     Toute la page (menu, accueil, notions, essentiel, évaluation) est construite
     par js/application.js à partir de contenu.js. Cette page ne contient que
     les LABOS, un <template> par module. -->
<body data-racine="../../">

  <!-- =================== LABO DU MODULE 1 =================== -->
  <template data-labo="1">
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Signal analogique, échantillons et niveaux</span><span id="s1-etat"></span></div>
          <canvas id="s1-cv" class="cv" width="1000" height="440" role="img" aria-label="Animation : une sinusoïde grise, ses échantillons en orange et le signal numérique reconstitué en bleu"></canvas>
        </div>
        <div class="readouts">
          <div><small>fe / f</small><b id="s1-rapport">—</b></div>
          <div><small>Shannon respecté ?</small><b id="s1-shannon">—</b></div>
          <div><small>Fréquence vue</small><b class="acc" id="s1-fa">—</b></div>
          <div><small>Niveaux 2ⁿ</small><b id="s1-niv">—</b></div>
          <div><small>Erreur max</small><b id="s1-err">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <p class="muted small">Pour l’exemple, le signal dure une seconde et ses fréquences sont de quelques hertz : le principe est exactement le même à 48 kHz ou à 74 MHz.</p>
          <label class="ctl"><span>Fréquence du signal f</span><input type="range" id="s1-f" min="1" max="12" step="0.5" value="3"><output id="s1-fo"></output></label>
          <label class="ctl"><span>Échantillonnage fe</span><input type="range" id="s1-fe" min="2" max="60" step="1" value="24"><output id="s1-feo"></output></label>
          <label class="ctl"><span>Quantification n</span><input type="range" id="s1-n" min="1" max="8" step="1" value="3"><output id="s1-no"></output></label>
          <div class="ctl"><span>Afficher</span><div id="s1-vue" aria-label="Courbes affichées : tout, seulement les échantillons (points), ou le signal codé"></div></div>
          <div class="btnrow" style="margin-top:12px"><button class="btn" id="s1-rejouer" type="button">▶ Rejouer l’animation</button></div>
        </div>
        <div class="card">
          <h3>Ce qu’il faut observer</h3>
          <div id="s1-msg" class="note" aria-live="polite"></div>
          <p class="muted small" style="margin:12px 0 8px">Essayez ces situations :</p>
          <div class="btnrow" id="s1-situations">
            <button class="chip" type="button" data-s="ok">Shannon respecté</button>
            <button class="chip" type="button" data-s="limite">Juste à la limite</button>
            <button class="chip" type="button" data-s="repli">Repliement</button>
            <button class="chip" type="button" data-s="bits">Trop peu de bits</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- =================== LABO DU MODULE 2 =================== -->
  <template data-labo="2">
    <div class="lab">
      <div class="lab-stage">
        <div class="stg">
          <div class="vt"><span>Un bloc de 8 × 4 pixels</span><div id="s2-choix" aria-label="Structure d’échantillonnage"></div></div>
          <canvas id="s2-grille" class="cv" width="960" height="480" role="img" aria-label="Schéma des échantillons"></canvas>
        </div>
        <div class="readouts">
          <div><small>Échantillons / pixel</small><b class="acc" id="s2-e">—</b></div>
          <div><small>Données vs 4:4:4</small><b id="s2-part">—</b></div>
          <div><small>Groupe de couleur</small><b id="s2-groupe">—</b></div>
          <div><small>Cb et Cr gardés</small><b id="s2-cb">—</b></div>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Lire le schéma</h3>
          <p class="small">Disque gris : échantillon de <b>luminance</b> (Y). Anneau bleu et rouge : échantillon de <b>chrominance</b> (Cb et Cr). Chaque cadre regroupe les pixels qui partagent la <b>même couleur</b>.</p>
          <div class="say" id="s2-texte" aria-live="polite"></div>
          <button class="btn" type="button" id="s2-defiler">▶ Faire défiler les structures</button>
        </div>
        <div class="card">
          <h3>L’effet sur une image test</h3>
          <div class="grid g2">
            <figure style="margin:0"><canvas id="s2-avant" class="cv" width="480" height="240" role="img" aria-label="Image test d’origine"></canvas><figcaption class="muted small" style="margin-top:6px">Image d’origine</figcaption></figure>
            <figure style="margin:0"><canvas id="s2-apres" class="cv" width="480" height="240" role="img" aria-label="Image test après sous-échantillonnage"></canvas><figcaption class="muted small" style="margin-top:6px" id="s2-legende">Après passage</figcaption></figure>
          </div>
          <p class="muted small" style="margin:10px 0 0">De gauche à droite : rayures verticales d’un pixel, rayures horizontales d’un pixel, puis deux diagonales fines. Ce sont les pires cas : sur une image réelle, la perte est bien plus discrète.</p>
        </div>
      </div>
    </div>
  </template>

  <!-- =================== LABO DU MODULE 3 =================== -->
  <template data-labo="3">
    <div class="lab">
      <div class="lab-stage">
        <div class="readouts">
          <div><small>Débit non compressé</small><b class="acc" id="s3-debit">—</b></div>
          <div><small>Par rapport au 4:4:4</small><b id="s3-part">—</b></div>
          <div><small>En octets</small><b id="s3-mo">—</b></div>
          <div><small>Une minute</small><b id="s3-go">—</b></div>
        </div>
        <div class="stg">
          <div class="vt"><span>Quelle liaison SDI pour ce signal ?</span></div>
          <div class="barres" id="s3-liaisons"></div>
          <p class="muted small" id="s3-verdict" style="margin:12px 2px 2px"></p>
        </div>
      </div>
      <div class="lab-ctl">
        <div class="card">
          <h3>Réglages</h3>
          <label class="ctl"><span>Définition</span>
            <select id="s3-def">
              <option value="720x576">720 × 576 (SD)</option>
              <option value="1280x720">1280 × 720 (HD)</option>
              <option value="1920x1080" selected>1920 × 1080 (HD)</option>
              <option value="3840x2160">3840 × 2160 (UHD)</option>
            </select>
          </label>
          <label class="ctl"><span>Cadence</span>
            <select id="s3-cad">
              <option value="24">24 images/s</option>
              <option value="25" selected>25 images/s</option>
              <option value="30">30 images/s</option>
              <option value="50">50 images/s</option>
              <option value="60">60 images/s</option>
            </select>
          </label>
          <div class="ctl"><span>Quantification</span><div id="s3-bits"></div></div>
          <div class="ctl"><span>Structure</span><div id="s3-struct"></div></div>
        </div>
        <div class="card">
          <h3>Calcul pas à pas</h3>
          <div class="calc" id="s3-calc" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </template>

  <!-- Scripts communs à tout le site (même ordre que sur les autres pages) -->
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/suivi.js"></script>
  <script src="../../js/commun.js"></script>
  <script src="../../js/catalogue.js"></script>
  <script src="../../js/applications.js"></script>
  <!-- Le kit application, puis le contenu et les labos de CETTE application -->
  <script src="../../js/application.js"></script>
  <script src="contenu.js"></script>
  <script src="labos.js"></script>
  <script>
    Application.demarrer(APPLICATION);
  </script>
</body>
</html>
