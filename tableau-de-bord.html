<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma progression — Révision BTS Audiovisuel</title>
  <script src="js/theme.js"></script>
  <script src="js/transition.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-racine="" data-page="progression">

  <header id="entete"></header>

  <main>
    <p class="fil-ariane"><a href="index.html">Accueil</a> › Ma progression</p>
    <div class="entree">
      <span class="eyebrow">Tableau de bord</span>
      <h1>Ma progression</h1>
      <!-- Indique d'où viennent les données : compte en ligne ou cet appareil -->
      <p id="origine-donnees" class="chapeau">Chargement…</p>
    </div>

    <!-- Trois chiffres clés, remplis par js/page-tableau-de-bord.js -->
    <div class="chiffres">
      <div class="chiffre"><strong id="chiffre-modules">–</strong><span>modules validés (au moins 12/20)</span></div>
      <div class="chiffre"><strong id="chiffre-moyenne">–</strong><span>moyenne des meilleures notes</span></div>
      <div class="chiffre"><strong id="chiffre-tentatives">–</strong><span>évaluations terminées</span></div>
    </div>

    <div class="sec-hd">
      <h2 class="sec-t">Par application</h2>
      <p class="muted">Une barre par module : verte quand il est validé, orange quand il a été tenté sans atteindre 12/20.</p>
    </div>
    <div class="suivi-apps" id="liste-progression"></div>
  </main>

  <footer id="pied"></footer>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/suivi.js"></script>
  <script src="js/commun.js"></script>
  <script src="js/catalogue.js"></script>
  <script src="js/applications.js"></script>
  <script src="js/page-tableau-de-bord.js"></script>
</body>
</html>
